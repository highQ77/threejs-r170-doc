<!doctype html>
<html lang="zh-Hant">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Three.js 繁中文件</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
  <link rel="stylesheet" href="assets/style.css">
  <script>
    /* 在渲染前套用已儲存的配色與深淺色，避免閃爍 */
    try {
      var d = document.documentElement;
      d.setAttribute('data-palette', localStorage.getItem('threejs-zh-doc:palette') || 'ocean');
      var t = localStorage.getItem('threejs-zh-doc:theme');
      if (t) d.setAttribute('data-theme', t);
    } catch (e) { document.documentElement.setAttribute('data-palette', 'ocean'); }
  </script>
</head>

<body>
  <div id="progress"></div>
  <header class="topbar">
    <button class="icon-btn" id="menuBtn" aria-label="切換目錄">
      <svg viewBox="0 0 24 24" width="18" height="18">
        <path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </svg>
    </button>
    <a class="brand" href="#/intro">
      <svg class="logo" viewBox="0 0 32 32" width="26" height="26" aria-hidden="true">
        <defs>
          <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" style="stop-color: var(--grad-a)" />
            <stop offset="1" style="stop-color: var(--grad-b)" />
          </linearGradient>
        </defs>
        <path d="M16 3 29 26H3Z" fill="none" stroke="url(#lg)" stroke-width="2.4" stroke-linejoin="round" />
        <path d="M16 3 16 26M9.5 14.5 22.5 14.5M16 26 9.5 14.5M16 26 22.5 14.5" fill="none" stroke="url(#lg)"
          stroke-width="1.4" stroke-linejoin="round" opacity=".75" />
      </svg>
      <span class="brand-text">Three.js <b>繁中文件</b></span>
    </a>
    <span class="ver" id="verTag"></span>
    <nav class="tabs" aria-label="文件分區">
      <a data-sec="guide" href="#/intro">教學指南</a>
      <a data-sec="api" href="#/api">API 參考</a>
    </nav>
    <div class="spacer"></div>
    <button class="search-trigger" id="searchTrigger" aria-label="搜尋">
      <svg viewBox="0 0 24 24" width="15" height="15">
        <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2" />
        <path d="m20 20-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </svg>
      <span>搜尋文件</span><kbd>⌘K</kbd>
    </button>
    <a class="icon-btn" href="https://threejs.org/docs/" target="_blank" rel="noopener" aria-label="官方文件"
      title="官方英文文件">
      <svg viewBox="0 0 24 24" width="17" height="17">
        <path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </a>
    <div class="palette-wrap">
      <button class="icon-btn" id="paletteBtn" aria-label="切換配色" title="切換配色" aria-haspopup="true" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="17" height="17"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.7-.9 1.4-1.8l-.3-.8c-.4-1.1.4-2.2 1.6-2.2H17a4 4 0 0 0 4-4c0-5-4-9.2-9-9.2Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="7.5" cy="11.5" r="1.3" fill="currentColor"/><circle cx="10.5" cy="7.5" r="1.3" fill="currentColor"/><circle cx="15.5" cy="8" r="1.3" fill="currentColor"/></svg>
      </button>
      <div class="palette-menu" id="paletteMenu" role="menu" hidden></div>
    </div>
    <button class="icon-btn" id="themeBtn" aria-label="切換深淺色" title="切換深淺色">
      <svg class="i-sun" viewBox="0 0 24 24" width="17" height="17">
        <circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2" />
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </svg>
      <svg class="i-moon" viewBox="0 0 24 24" width="17" height="17">
        <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linejoin="round" />
      </svg>
    </button>
  </header>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="search-box">
        <svg viewBox="0 0 24 24" width="15" height="15">
          <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2" />
          <path d="m20 20-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
        <input type="search" id="search" placeholder="搜尋類別、屬性、方法…" autocomplete="off">
      </div>
      <nav id="nav"></nav>
    </aside>
    <main id="main" tabindex="-1"></main>
    <aside class="pagetoc" id="pageToc" aria-label="本頁目錄"></aside>
  </div>
  <div class="scrim" id="scrim"></div>
  <button class="to-top" id="toTop" aria-label="回到頂端">
    <svg viewBox="0 0 24 24" width="18" height="18">
      <path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round" />
    </svg>
  </button>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/runmode/runmode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
  <script src="assets/content.js"></script>
  <script src="assets/content2.js"></script>
  <script src="assets/api/api-core.js"></script>
  <script src="assets/api/api-objects.js"></script>
  <script src="assets/api/api-geometries.js"></script>
  <script src="assets/api/api-materials.js"></script>
  <script src="assets/api/api-lights.js"></script>
  <script src="assets/api/api-textures-anim.js"></script>
  <script src="assets/api/api-math.js"></script>
  <script src="assets/api/api-addons.js"></script>
  <script src="assets/api/api-x-core.js"></script>
  <script src="assets/api/api-x-objects.js"></script>
  <script src="assets/api/api-x-gml.js"></script>
  <script src="assets/api/api-x-math.js"></script>
  <script src="assets/api/api-x-tex-load.js"></script>
  <script src="assets/api/api-x-addons1.js"></script>
  <script src="assets/api/api-x-addons2.js"></script>
  <script src="assets/api/api-index.js"></script>
  <script src="assets/app.js"></script>
</body>

</html>
